name: Deploy DEV (Cloud Run)

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Rama o ref a desplegar (default: develop)'
        required: false
        default: 'develop'

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID_DEV || 'new-ponti-dev' }}
      ARTIFACT_REGISTRY: ${{ vars.ARTIFACT_REGISTRY || 'cloud-run-source-deploy' }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME || 'ponti-mobile' }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME_DEV || 'ponti-mobile' }}
      CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_SERVICE_ACCOUNT_DEV || 'cloudrun-sa@new-ponti-dev.iam.gserviceaccount.com' }}
      WIF_PROVIDER: ${{ vars.WIF_PROVIDER_DEV }}
      WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT_DEV }}
      BASE_MANAGER_API: ${{ vars.BASE_MANAGER_API_DEV || 'https://ponti-backend-vjhlkdxpoa-uc.a.run.app/api/v1' }}
      IDENTITY_PLATFORM_PROJECT_ID: ${{ vars.IDENTITY_PLATFORM_PROJECT_ID_DEV || 'new-ponti-dev' }}
      SECRET_X_API_KEY_NAME: x-api-key-dev
      SECRET_IDENTITY_PLATFORM_API_KEY_NAME: identity-platform-api-key-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build y push imagen
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          image_uri="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker build -t "$image_uri" .
          docker push "$image_uri"
          echo "IMAGE_URI=$image_uri" >> "$GITHUB_ENV"

      - name: Deploy a Cloud Run (DEV)
        run: |
          ENV_VARS="NODE_ENV=production,BASE_MANAGER_API=${BASE_MANAGER_API},IDENTITY_PLATFORM_PROJECT_ID=${IDENTITY_PLATFORM_PROJECT_ID}"
          gcloud run deploy "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$IMAGE_URI" \
            --service-account="$CLOUD_RUN_SERVICE_ACCOUNT" \
            --set-env-vars="${ENV_VARS}" \
            --set-secrets="X_API_KEY=${SECRET_X_API_KEY_NAME}:latest,IDENTITY_PLATFORM_API_KEY=${SECRET_IDENTITY_PLATFORM_API_KEY_NAME}:latest" \
            --allow-unauthenticated

      - name: Resolve service URL (DEV)
        run: |
          service_url="$(gcloud run services describe "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(status.url)')"
          if [[ -z "$service_url" ]]; then
            echo "ERROR: no se pudo resolver status.url del servicio DEV."
            exit 1
          fi
          echo "SERVICE_URL=$service_url" >> "$GITHUB_ENV"

      - name: Guardrail traffic/latest + URLs estables (DEV)
        run: |
          service_json="$(gcloud run services describe "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='json')"
          SERVICE_JSON="$service_json" python3 - <<'PY'
          import json, os, sys
          svc = json.loads(os.environ["SERVICE_JSON"])
          traffic = svc.get("status", {}).get("traffic", [])
          ok_latest = any(
              t.get("latestRevision") is True and int(t.get("percent", 0)) == 100
              for t in traffic
          )
          if not ok_latest:
              print("ERROR: el tráfico no está 100% en latestRevision.")
              sys.exit(1)
          envs = svc.get("spec", {}).get("template", {}).get("spec", {}).get("containers", [{}])[0].get("env", [])
          bad = []
          for env in envs:
              if env.get("name") == "BASE_MANAGER_API":
                  value = env.get("value", "")
                  if "---" in value:
                      bad.append(value)
          if bad:
              print("ERROR: BASE_MANAGER_API quedó con URL taggeada:")
              for item in bad:
                  print(f" - {item}")
              sys.exit(1)
          print("Guardrail OK.")
          PY

      - name: Smoke release checks (DEV)
        run: |
          curl -fsS "$SERVICE_URL/health" >/dev/null
          curl -fsSI "$SERVICE_URL/" >/dev/null
          curl -fsSI "$SERVICE_URL/home" >/dev/null
          status="$(curl -sS -o /tmp/login-response.json -w '%{http_code}' \
            -X POST "$SERVICE_URL/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            --data '{"email":"invalid","password":"invalid"}')"
          if [[ "$status" != "401" ]]; then
            echo "ERROR: login smoke devolvió HTTP $status"
            cat /tmp/login-response.json || true
            exit 1
          fi
