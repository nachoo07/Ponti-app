services:
  app:
    # Dockerfile raíz: compila UI + API y el BFF sirve el frontend desde dist/public.
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8090:8080"
    environment:
      NODE_ENV: production
    env_file:
      # required: false → no falla en un clone limpio donde api/.env no existe
      # (las vars pueden venir por `environment` o por el entorno del host).
      - path: api/.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
