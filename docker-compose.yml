services:
  app:
    # Dockerfile raíz: compila UI + API y el BFF sirve el frontend desde dist/public.
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8090:8080"
    environment:
      NODE_ENV: production
    env_file:
      - api/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
